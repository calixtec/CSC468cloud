apiVersion: apps/v1
kind: Deployment
metadata:
  name: webui
  labels:
    run: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webui
  template:
    metadata:
      labels:
        app: webui
    spec:
      containers:
      - name: web-con
        image: cc976948/468:webui4
        ports:
          - name: http-port
            containerPort: 80
